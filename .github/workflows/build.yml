name: Build Mod
on: [push]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Build Native DLL via build.cmd
        shell: cmd
        run: |
          for /f "delims=" %%i in ('dir /b /s build.cmd') do (
            cd /d "%%~dpi"
            call "%%i"
          )
      - name: Build Menu
        shell: pwsh
        run: |
          $root = (Get-ChildItem -Recurse -Filter "bridge.cpp" | Select-Object -First 1).Directory.Parent.FullName
          Set-Location $root
          dotnet publish src\DirtTownMenu\DirtTownMenu.csproj -c Release -r win-x64 --self-contained false -o "$root\dist\DirtTownMenu"
      - uses: actions/upload-artifact@v4
        with:
          name: winmm-deutsch
          path: "**/dist/**"
