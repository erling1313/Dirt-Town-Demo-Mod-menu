name: Build Mod
on: [push]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - run: powershell -ExecutionPolicy Bypass -File Build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: winmm-deutsch
          path: dist/winmm.dll
