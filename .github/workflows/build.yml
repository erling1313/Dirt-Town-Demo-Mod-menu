name: Build Mod
on: [push]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Find and Build Mod
        shell: pwsh
        run: |
          $buildScript = Get-ChildItem -Recurse -Filter "Build.ps1" | Select-Object -First 1
          if (-not $buildScript) { throw "Build.ps1 wurde im Repository nicht gefunden!" }
          Set-Location $buildScript.DirectoryName
          .\Build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: winmm-deutsch
          path: "**/dist/winmm.dll"
