name: Build Mod
on: [push]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Build Exact Mod Package
        shell: cmd
        run: |
          for /f "delims=" %%i in ('dir /b /s bridge.cpp') do set "NATIVEDIR=%%~dpi"
          cd /d "%NATIVEDIR%.."
          if not exist "artifacts\DirtTownMenu-0.6.3" mkdir "artifacts\DirtTownMenu-0.6.3"
          ml64 /nologo /c /Fo"artifacts\winmm_proxy.obj" "native\winmm_proxy.asm"
          if errorlevel 1 exit /b 1
          ml64 /nologo /c /Fo"artifacts\terrain_camera.obj" "native\terrain_camera.asm"
          if errorlevel 1 exit /b 1
          cl /nologo /std:c++20 /EHsc /O2 /MT /LD "native\bridge.cpp" "artifacts\winmm_proxy.obj" "artifacts\terrain_camera.obj" /Fo:"artifacts\bridge10.obj" /link user32.lib bcrypt.lib /DEF:"native\winmm_proxy.def" /IMPLIB:"artifacts\winmm.lib" /OUT:"artifacts\DirtTownMenu-0.6.3\winmm.dll"
          if errorlevel 1 exit /b 1
          dotnet publish "src\DirtTownMenu\DirtTownMenu.csproj" -c Release -r win-x64 --self-contained false -o "artifacts\DirtTownMenu-0.6.3"
      - uses: actions/upload-artifact@v4
        with:
          name: DirtTownMenu-Deutsch
          path: "**/artifacts/DirtTownMenu-0.6.3/**"
